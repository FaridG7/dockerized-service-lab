worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream secret_service {
        # "app" matches the service name in docker-compose.yml.
        # Docker's internal DNS resolves it to the container's IP.
        server app:3000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://secret_service;

            # Preserve original request info for the upstream app
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # Pass Basic Auth credentials through untouched
            proxy_pass_header Authorization;
        }
    }
}
