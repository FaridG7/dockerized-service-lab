services:
  app:
    build: ./app/
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - internal
    restart: unless-stopped

  nginx:
    build: ./nginx/
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
